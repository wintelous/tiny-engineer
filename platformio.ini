; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
; Arduino-ESP32 3.x (ESP_I2S + rgbLedWrite); official PIO platform stays on 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
    bblanchon/ArduinoJson@^7.4.3
    links2004/WebSockets@^2.7.1

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SSD1306_NO_SPLASH
    -D WEBSOCKETS_SERVER_CLIENT_MAX=4
    -D WEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Empty keeps assets/. Set to a mods/<name> folder to overlay its WAVs
; (example: halloween). Clips the mod does not ship stay stock.
custom_audio_mod =

extra_scripts =
    pre:scripts/firmware_version.py
    pre:scripts/copy_assets.py
    pre:scripts/embed_ui.py
    pre:scripts/park_servos_before_upload.py
    post:scripts/upload_fs_after_upload.py

; Host Unity tests — never flash. Run: pio test -e native
test_ignore = *

; Opt-in Wi-Fi updates: two OTA app slots instead of coredump, and 960 KB LittleFS.
[env:ota]
extends = env:esp32-c3-devkitm-1
board_build.partitions = partitions_ota.csv
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -D TE_OTA
extra_scripts =
    ${env:esp32-c3-devkitm-1.extra_scripts}
    post:scripts/ota.py

; ESP32-C3 SuperMini with discrete breakouts and a common-cathode RGB LED instead of the
; C3-Zero's WS2812: docs/hardware/supermini.md, desk parts in mods/esp32-c3-supermini.
; Build: pio run -e supermini
[env:supermini]
extends = env:esp32-c3-devkitm-1
; Conservative flash timing for the SuperMini's flash chip.
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -D TE_BOARD_SUPERMINI
custom_ui_board = supermini

; SuperMini bench tests: separate applications at the same app offset, built on demand.
; None of them writes NVS or LittleFS, and all keep the PCA9685 OE pin HIGH until told
; otherwise. Details: docs/hardware/supermini.md#bench-tests.
; RGB LED on GPIO6/7/10 only; no I2C modules needed.
[env:supermini-rgb-test]
platform = ${env:esp32-c3-devkitm-1.platform}
board = ${env:esp32-c3-devkitm-1.board}
framework = ${env:esp32-c3-devkitm-1.framework}
board_build.flash_mode = ${env:supermini.board_build.flash_mode}
board_build.f_flash = ${env:supermini.board_build.f_flash}
board_build.partitions = partitions.csv
build_flags = ${env:supermini.build_flags}
monitor_speed = 115200
build_src_filter =
    -<*>
    +<../examples/rgb-test/main.cpp>
test_ignore = *

; Short full-scale I2S beeps, muted after three rounds.
[env:supermini-audio-test]
extends = env:supermini-rgb-test
build_src_filter =
    -<*>
    +<../examples/audio-test/main.cpp>

; One SG90 channel over serial: bounded pulses, released after two seconds.
[env:supermini-servo-test]
extends = env:supermini-rgb-test
lib_deps = adafruit/Adafruit PWM Servo Driver Library
build_src_filter =
    -<*>
    +<../examples/servo-test/main.cpp>

; The same over Wi-Fi with the IP on the OLED; credentials in an ignored header.
[env:supermini-servo-wifi-test]
extends = env:supermini-servo-test
build_flags =
    ${env:supermini-servo-test.build_flags}
    -D SERVO_WIFI_TEST
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306

; I2C scan, PCA9685 register read (no PWM), OLED faces and the RGB LED together.
[env:supermini-hardware-test]
extends = env:supermini-rgb-test
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
build_src_filter =
    -<*>
    +<../examples/hardware-test/main.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter =
    -<**/*.*>
    +<settings/validate.cpp>
    +<settings/wifi_network_list.cpp>
    +<actions/action.cpp>
    +<actions/action_list.cpp>
    +<actions/pattern.cpp>
    +<actions/migrate.cpp>
    +<display/eyes/styles/eye_style_ids.cpp>
    +<audio/wav_parser.cpp>
    +<audio/audio_motion.cpp>
    +<serial/frame.cpp>
    +<serial/protocol.cpp>
    +<extensions/push_button_logic.cpp>
    +<extensions/pin_claims.cpp>
build_flags = -std=c++17 -Iinclude -Isrc

; Settings checks with the SuperMini build's pin rules. Run: pio test -e native-supermini
[env:native-supermini]
extends = env:native
build_flags = ${env:native.build_flags} -D TE_BOARD_SUPERMINI
test_filter = test_settings_validate

; Opt-in OLED-only application. Building does not upload or change robot settings.
[env:expression-demo]
platform = ${env:esp32-c3-devkitm-1.platform}
board = ${env:esp32-c3-devkitm-1.board}
framework = ${env:esp32-c3-devkitm-1.framework}
monitor_speed = ${env:esp32-c3-devkitm-1.monitor_speed}
build_flags = ${env:esp32-c3-devkitm-1.build_flags}
; For an upside-down OLED, append: -D EXPRESSION_DEMO_ROTATION=2
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit SSD1306
build_src_filter =
    -<*>
    +<../examples/expression-demo/main.cpp>
test_ignore = *

; Opt-in PCBA session. Building does not upload or change the default robot env.
[env:pcba-test]
platform = ${env:esp32-c3-devkitm-1.platform}
board = ${env:esp32-c3-devkitm-1.board}
framework = ${env:esp32-c3-devkitm-1.framework}
monitor_speed = ${env:esp32-c3-devkitm-1.monitor_speed}
build_flags = ${env:esp32-c3-devkitm-1.build_flags}
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
build_src_filter =
    -<*>
    +<../examples/pcba-test/main.cpp>
test_ignore = *
